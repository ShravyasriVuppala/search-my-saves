[project]
name = "sms-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "supabase>=2.10.0",
    "requests>=2.32.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=11.0.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
