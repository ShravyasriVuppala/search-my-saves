name: Keep Supabase awake

on:
  schedule:
    # Supabase free-tier projects pause after 7 days with no API activity
    # (plan.md D6) -- once a week leaves comfortable margin.
    - cron: "0 12 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the keepalive endpoint
        run: curl --fail --silent --show-error "${{ secrets.APP_URL }}/api/keepalive"
